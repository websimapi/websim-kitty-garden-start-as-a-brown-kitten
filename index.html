<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kitty Garden — Start as a Brown Kitten</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "nipplejs": "https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"
    }
  }
  </script>
</head>
<body>
  <main class="app">
    <!-- UI hidden for now -->
    <header class="hud hidden" aria-hidden="true">
      <div class="title">Kitty Garden</div>
      <div class="info">Use WASD / arrow keys to move. Tap or use on-screen joystick on mobile.</div>
    </header>

    <div class="stage-wrap">
      <canvas id="gameCanvas" width="800" height="600" aria-label="Kitty Garden game canvas"></canvas>
      <div id="joystick" class="joystick" aria-hidden="true"></div>

      <!-- pickup toast shows what was collected -->
      <div id="pickupToast" class="pickup-toast" aria-live="polite" aria-atomic="true"></div>

      <!-- added ABXY gamepad -->
      <div id="gamepad" class="gamepad" aria-hidden="false" role="group" aria-label="Gamepad">
        <div class="pad-row">
          <button class="btn btn-x" id="btnX" aria-label="X button">X</button>
          <button class="btn btn-y" id="btnY" aria-label="Y button">Y</button>
        </div>
        <div class="pad-row">
          <button class="btn btn-a" id="btnA" aria-label="A button">A</button>
          <button class="btn btn-b" id="btnB" aria-label="B button">B</button>
        </div>
      </div>
    </div>

    <!-- Controls hidden for a minimal view; joystick remains for touch -->
    <footer class="controls hidden" aria-hidden="true">
      <button id="resetBtn">Reset Position</button>
      <label><input id="toggleDebug" type="checkbox"> Show debug</label>
    </footer>
  </main>

  <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
